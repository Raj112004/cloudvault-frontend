<style>

  :root {

    --bg: #080809;

    --surface: #0f0f11;

    --surface2: #161619;

    --border: #1e1e23;

    --border2: #2a2a32;

    --text: #ededf0;

    --text2: #7a7a8a;

    --text3: #44444f;

    --accent: #6c63ff;

    --accent2: #a78bfa;

    --pink: #f472b6;

    --green: #22c55e;

    --red: #ef4444;

    --player-yellow: #ffb703;

    --player-cyan: #00d2ff;

  }

  , ::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  body {

    background: var(--bg);

    color: var(--text);

    font-family: 'Roboto', 'Open Sans', sans-serif;

    min-height: 100vh;

    overflow-x: hidden;

  }

  /* HEADER */

  header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 12px 20px;

    border-bottom: 1px solid var(--border);

    background: rgba(8,8,9,0.96);

    backdrop-filter: blur(16px);

    position: sticky;

    top: 0;

    z-index: 100;

  }

  .logo-wrap { display: flex; flex-direction: column; gap: 1px; }

  .logo { display: flex; align-items: center; gap: 9px; font-family: 'Syne', sans-serif; font-size: 17px; font-weight: 700; }

  .logo-icon {

    width: 28px; height: 28px;

    background: linear-gradient(135deg, var(--accent), var(--pink));

    border-radius: 8px;

    display: flex; align-items: center; justify-content: center;

    font-size: 14px;

  }

  .logo-tagline {

    font-size: 10px;

    background: linear-gradient(90deg, #60a5fa, #818cf8, #a78bfa);

    -webkit-background-clip: text;

    -webkit-text-fill-color: transparent;

    font-weight: 600;

    padding-left: 37px;

  }

  .btn {

    border: none;

    font-family: inherit;

    font-size: 13px;

    font-weight: 500;

    padding: 8px 16px;

    border-radius: 8px;

    cursor: pointer;

    transition: all 0.15s;

    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 6px;

  }

  .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border2); }

  .btn-ghost:hover { background: var(--border2); }

  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }

  .btn-primary:hover { opacity: 0.88; }

  /* LAYOUT */

  .layout { display: grid; grid-template-columns: 210px 1fr; min-height: calc(100vh - 56px); }

  aside {

    border-right: 1px solid var(--border);

    padding: 16px 10px;

    background: var(--surface);

    display: flex;

    flex-direction: column;

  }

  .upload-btn {

    width: 100%;

    padding: 10px;

    background: linear-gradient(135deg, var(--accent), var(--pink));

    color: #fff;

    border: none;

    border-radius: 8px;

    font-family: inherit;

    font-size: 13px;

    font-weight: 600;

    cursor: pointer;

    margin-bottom: 18px;

    display: flex; align-items: center; justify-content: center; gap: 6px;

  }

  .sidebar-label {

    font-size: 10px;

    font-weight: 700;

    letter-spacing: 0.08em;

    color: var(--text3);

    text-transform: uppercase;

    padding: 0 8px;

    margin: 10px 0 4px;

  }

  .sidebar-item {

    display: flex; align-items: center; gap: 8px;

    padding: 8px 10px;

    border-radius: 7px;

    cursor: pointer;

    font-size: 13px;

    font-weight: 500;

    color: var(--text2);

    transition: all 0.12s;

  }

  .sidebar-item:hover { background: var(--surface2); color: var(--text); }

  .sidebar-item.active { background: rgba(108,99,255,0.12); color: var(--accent); }

  .sidebar-count {

    margin-left: auto;

    font-size: 10px;

    font-family: 'DM Mono', monospace;

    color: var(--text3);

    background: var(--surface2);

    padding: 1px 6px;

    border-radius: 99px;

  }

  .storage-widget {

    margin-top: auto;

    padding: 12px;

    background: var(--surface2);

    border-radius: 8px;

    border: 1px solid var(--border);

  }

  .storage-label { font-size: 11px; color: var(--text2); margin-bottom: 6px; display: flex; justify-content: space-between; }

  .storage-bar { height: 4px; background: var(--border2); border-radius: 99px; overflow: hidden; margin-bottom: 6px; }

  .storage-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--pink)); width: 0%; transition: width 0.6s ease; }

  .storage-detail { font-size: 10px; color: var(--text3); font-family: 'DM Mono', monospace; }

  main { padding: 18px 22px; overflow-y: auto; }

  .drop-zone {

    border: 1.5px dashed var(--border2);

    border-radius: 12px;

    padding: 28px 18px;

    text-align: center;

    margin-bottom: 20px;

    cursor: pointer;

    transition: all 0.2s;

  }

  .drop-zone:hover { border-color: var(--accent); background: rgba(108,99,255,0.03); }

  .drop-icon { font-size: 30px; margin-bottom: 6px; display: block; }

  .drop-title { font-size: 14px; font-weight: 600; margin-bottom: 3px; }

  .drop-sub { font-size: 12px; color: var(--text2); }

  .drop-sub span { color: var(--accent); }

  .drop-meta { font-size: 10px; color: var(--text3); margin-top: 6px; font-family: 'DM Mono', monospace; }

  #fileInput { display: none; }

  .upload-progress {

    display: none;

    background: var(--surface);

    border: 1px solid var(--border);

    border-radius: 8px;

    padding: 12px 14px;

    margin-bottom: 16px;

  }

  .progress-header { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px; color: var(--text2); }

  .progress-bar-wrap { height: 4px; background: var(--border2); border-radius: 99px; overflow: hidden; }

  .progress-bar { height: 100%; background: linear-gradient(90deg, var(--accent), var(--pink)); width: 0%; transition: width 0.1s linear; }

  .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }

  .toolbar-left { display: flex; align-items: center; gap: 8px; }

  .toolbar h2 { font-size: 15px; font-weight: 700; font-family: 'Syne', sans-serif; }

  .file-count { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; background: var(--surface2); padding: 2px 8px; border-radius: 99px; }

  .toolbar-right { display: flex; gap: 6px; align-items: center; }

  .search-box {

    background: var(--surface);

    border: 1px solid var(--border);

    border-radius: 7px;

    padding: 7px 11px;

    font-family: inherit;

    font-size: 12px;

    color: var(--text);

    outline: none;

    width: 160px;

  }

  .view-toggle { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }

  .view-toggle button { background: none; border: none; padding: 6px 10px; cursor: pointer; color: var(--text3); font-size: 13px; }

  .view-toggle button.active { background: var(--surface2); color: var(--text); }

  /* RESPONSIVE FILE GRID */

    gap: 12px;

  .file-card {

    position: relative;

    display: flex;

    flex-direction: column;

  }

  .file-card:hover { border-color: var(--border2); transform: translateY(-2px); }

  .file-thumb {

    width: 100%;

    aspect-ratio: 16/10;

    background: var(--surface2);

    display: flex; align-items: center; justify-content: center;

    position: relative;

    overflow: hidden;

  }

  .file-thumb video, .file-thumb img { width: 100%; height: 100%; object-fit: cover; }

  .play-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.15s; }

  .file-card:hover .play-overlay { opacity: 1; }

  .play-btn { width: 34px; height: 34px; background: rgba(255,255,255,0.92); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-size: 13px; }

  .file-type-badge { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,0.7); font-size: 9px; font-family: 'DM Mono', monospace; padding: 2px 5px; border-radius: 4px; color: var(--text2); }

  .card-menu-btn {

    background: var(--surface2);

    border: 1px solid var(--border2);

    border-radius: 5px;

    color: var(--text2);

    cursor: pointer;

    font-size: 14px;

    padding: 1px 5px;

    line-height: 1;

  }

  .card-dropdown {

    position: fixed;

    background: #18181c;

    border: 1px solid var(--border2);

    border-radius: 8px;

    padding: 4px;

    z-index: 9999;

    min-width: 155px;

    box-shadow: 0 10px 30px rgba(0,0,0,0.8);

    display: none;

  }

  .card-dropdown.open { display: block; }

  .dropdown-item {

    display: flex; align-items: center; gap: 8px;

    padding: 7px 10px;

    border-radius: 6px;

    cursor: pointer;

    font-size: 12px;

    color: var(--text2);

    border: none; background: none; width: 100%; text-align: left; font-family: inherit;

  }

  .dropdown-item:hover { background: var(--surface2); color: var(--text); }

  .dropdown-item.danger:hover { color: var(--red); }

  .file-info { padding: 8px 10px; }

  .file-name { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }

  .file-meta { font-size: 10px; color: var(--text3); font-family: 'DM Mono', monospace; display: flex; justify-content: space-between; }

  /* LIST VIEW */

  .file-list { display: flex; flex-direction: column; gap: 2px; }

  .file-row {

    display: grid; grid-template-columns: 24px 1fr 70px 80px 100px 80px;

    align-items: center; gap: 10px;

    padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 12px;

  }

  .file-row:hover { background: var(--surface); }

  .file-row-name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .file-row-type { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text3); }

  .file-row-size { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text2); }

  .file-row-date { font-size: 11px; color: var(--text3); }

  .file-row-actions { display: flex; gap: 4px; justify-content: flex-end; opacity: 0; }

  .file-row:hover .file-row-actions { opacity: 1; }

  .row-btn { background: none; border: 1px solid var(--border2); border-radius: 4px; color: var(--text2); font-size: 11px; padding: 2px 6px; cursor: pointer; }

  /* MODAL & PRO VIDEO PLAYER */

  .modal-overlay {

    position: fixed; inset: 0;

    background: rgba(0,0,0,0.92);

    backdrop-filter: blur(12px);

    z-index: 200;

    display: none;

    align-items: center; justify-content: center;

    padding: 12px;

  }

  .modal-overlay.open { display: flex; }

  .modal {

    background: #0d0d10;

    border: 1px solid #22222a;

    border-radius: 12px;

    width: 100%;

    max-width: 820px;

    overflow: hidden;

    box-shadow: 0 20px 60px rgba(0,0,0,0.9);

  }

  .modal-header {

    display: flex; align-items: center; justify-content: space-between;

    padding: 10px 14px;

    border-bottom: 1px solid #1c1c24;

    background: #111116;

  }

  .modal-title { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; overflow: hidden; }

  .modal-title span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .modal-close { background: none; border: none; color: #888898; font-size: 16px; cursor: pointer; padding: 4px 8px; border-radius: 4px; }

  .modal-close:hover { color: #fff; background: #22222c; }

  .video-container {

    background: #000;

    width: 100%;

    aspect-ratio: 16/9;

    display: flex; align-items: center; justify-content: center;

    position: relative;

    overflow: hidden;

  }

  .cv-player { position: relative; width: 100%; height: 100%; background: #000; overflow: hidden; user-select: none; }

  .cv-player video { width: 100%; height: 100%; object-fit: contain; display: block; }

  .cv-center-play-overlay {

    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;

    pointer-events: none; z-index: 5; transition: opacity 0.2s;

  }

  .cv-center-play-btn {

    width: 60px; height: 60px;

    background: rgba(255, 255, 255, 0.95);

    clip-path: polygon(25% 15%, 25% 85%, 85% 50%);

    filter: drop-shadow(0 4px 16px rgba(0,0,0,0.7));

  }

  .cv-player.playing .cv-center-play-overlay { opacity: 0; }

  .cv-subtitles-box {

    position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%);

    text-align: center; pointer-events: none; z-index: 10;

    font-size: 15px; color: #fff; background: rgba(0,0,0,0.6);

    padding: 3px 10px; border-radius: 4px; display: none;

  }

  .cv-controls {

    position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end;

  /* Timeline */

  .cv-prog-wrap { position: relative; height: 14px; display: flex; align-items: center; cursor: pointer; }

  .cv-prog-fill { position: absolute; height: 100%; width: 0%; background: var(--player-yellow); border-radius: 2px; }

  .cv-prog-fill::after {

    content: ''; position: absolute; right: 0; top: -1px; bottom: -1px; width: 5px;

    background: var(--player-cyan); box-shadow: 0 0 6px var(--player-cyan);

  }

  .cv-time-tip {

    position: absolute; bottom: 18px; transform: translateX(-50%);

    background: #111; color: #fff; font-size: 10px; font-family: 'DM Mono', monospace;

    padding: 2px 6px; border-radius: 3px; border: 1px solid var(--border2);

    pointer-events: none; opacity: 0; white-space: nowrap;

  }

  .cv-prog-wrap:hover .cv-time-tip { opacity: 1; }

  .cv-btn-row { display: flex; align-items: center; justify-content: space-between; }

  .cv-btn-group { display: flex; align-items: center; gap: 4px; }

  .cv-btn {

    background: none; border: none; color: #e0e0e8; cursor: pointer;

    padding: 5px; border-radius: 5px; display: flex; align-items: center; justify-content: center;

  }

  .cv-btn:hover { color: #fff; background: rgba(255,255,255,0.14); }

  .cv-btn svg { width: 18px; height: 18px; fill: currentColor; }

  .cv-time { font-size: 11px; color: #ccc; font-family: 'Roboto', sans-serif; white-space: nowrap; padding-left: 2px; }

  .cv-skip-btn {

  }

  .cv-skip-btn:hover { color: #fff; background: rgba(255,255,255,0.14); }

  .cv-skip-btn svg { width: 22px; height: 22px; display: block; }

  .cv-cc-badge { font-size: 10px; font-weight: 700; border: 1.5px solid currentColor; padding: 0 3px; border-radius: 3px; line-height: 1.1; }

  .cv-set-pane { display: none; }

  .cv-set-pane.active { display: block; }

  .cv-pane-item { padding: 8px 14px; color: #b0b0be; cursor: pointer; display: flex; align-items: center; }

  .modal-action-bar {

    padding: 12px 14px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 12px;

    background: #0d0d10;

  }

  .modal-file-details {
